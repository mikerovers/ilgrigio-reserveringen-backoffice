security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        api_key_users:
            id: App\Security\ApiKeyUserProvider
        # backs the JWT login firewall — loads App\Entity\User by email
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Issues JWTs. Stateless, no session — CSRF is disabled since there's
        # no session to protect; this is a bearer-token issuance endpoint
        # called by an external SPA.
        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # Exchanges a still-valid refresh token for a new JWT (+ new refresh
        # token). Public/stateless, same as `login` — the refresh token
        # itself is the credential here, not a session.
        refresh:
            pattern: ^/api/token/refresh
            stateless: true
            provider: app_user_provider
            refresh-jwt:
                check_path: /api/token/refresh

        # check-in and order-process accept ONLY a JWT bearer token (jwt: ~,
        # registered by LexikJWTAuthenticationBundle) — the legacy X-API-KEY
        # header is deliberately NOT accepted here. Must appear before the
        # general `api` firewall below — Symfony picks the first firewall
        # whose pattern matches.
        secure_api:
            pattern: ^/api/(events/[^/]+/check-in|orders/[^/]+/process)
            stateless: true
            provider: app_user_provider
            jwt: ~

        # All other /api/* routes — unchanged, API-key only.
        api:
            pattern: ^/api
            stateless: true
            provider: api_key_users
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator

        # Session-based login for the /admin backoffice UI (EasyAdminBundle).
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin
            logout:
                path: admin_logout
                target: admin_login

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used.
    # access_control may only be defined ONCE across all merged config files
    # for a given environment, so all rules live here. The HTTPS requirement on
    # non-API routes is driven by the SECURE_CHANNEL env var (https in prod,
    # null elsewhere) so it can be enforced in production without breaking
    # local http development.
    access_control:
        # API doc UI (dev/test only — bundle isn't even registered in prod)
        - { path: '^/api/doc', roles: PUBLIC_ACCESS }
        # Login endpoint issues the JWT itself — not authenticated yet. Must
        # precede the generic ^/api rule below (access_control is
        # first-match-wins across the whole list, independent of firewalls).
        - { path: '^/api/login', roles: PUBLIC_ACCESS }
        # Refresh endpoint authenticates via the refresh token itself, not IS_AUTHENTICATED
        - { path: '^/api/token/refresh', roles: PUBLIC_ACCESS }
        # Public storefront endpoints (called by anonymous browsers, no API key)
        # Kept on PUBLIC_ACCESS so CORS preflight / anonymous calls work.
        - { path: '^/api/(validate-coupon|remove-coupon|available-events)', roles: PUBLIC_ACCESS }
        # Mollie webhook — server-to-server, no API key; security via re-fetching from Mollie API
        - { path: '^/webhook/mollie', roles: PUBLIC_ACCESS }
        # All other /api routes require authentication (order-processing API,
        # plus the JWT-only check-in/order-process routes)
        - { path: ^/api, roles: IS_AUTHENTICATED }
        # Admin login form must be reachable while logged out
        - { host: '%admin_host%', path: ^/login, roles: PUBLIC_ACCESS }
        # Backoffice UI (EasyAdminBundle), served on its own subdomain — admins only
        - { host: '%admin_host%', path: ^/, roles: ROLE_ADMIN }
        # Force HTTPS on non-API routes (prod only, via SECURE_CHANNEL)
        - { path: ^/, requires_channel: '%env(default::SECURE_CHANNEL)%' }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
