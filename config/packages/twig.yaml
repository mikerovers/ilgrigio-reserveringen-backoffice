twig:
    file_name_pattern: '*.twig'
    # Stored instants are UTC; templates show venue (Amsterdam) wall-clock time.
    date:
        timezone: Europe/Amsterdam
    globals:
        ilgrigio_reserveringen_base_url: '%ilgrigio_reserveringen_base_url%'
        customer_login_enabled: '%env(bool:CUSTOMER_LOGIN_ENABLED)%'

when@test:
    twig:
        strict_variables: true
