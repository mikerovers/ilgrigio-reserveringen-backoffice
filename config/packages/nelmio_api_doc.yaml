when@dev: &nelmio_api_doc_config
    nelmio_api_doc:
        documentation:
            info:
                title: Il Grigio Reserveringen Backoffice API
                description: |
                    Internal API documentation.

                    Dates and times: every timestamp in a response is an ISO 8601 date-time string
                    in UTC with an explicit offset (for example `2026-10-19T20:21:58+00:00`). Treat the
                    offset in the value as authoritative and convert to the venue's local time
                    (Europe/Amsterdam) for display. Event times (`startsAt`, `endsAt`, `soldFrom`,
                    `soldUntil`) are instants, not floating local times. Money is in integer cents.
                version: 1.0.0
            components:
                securitySchemes:
                    # Registered here (not under areas.default.security) so it's
                    # available for the #[Security(name: 'BearerAuth')] override
                    # on check-in/order-process without becoming every route's
                    # default requirement alongside ApiKeyAuth.
                    BearerAuth:
                        type: http
                        scheme: bearer
                        bearerFormat: JWT
        areas:
            default:
                path_patterns:
                    # Document /api routes, excluding available-events, validate-coupon,
                    # and remove-coupon.
                    - "^/api(?!/(available-events|validate-coupon|remove-coupon)$)"
                security:
                    ApiKeyAuth:
                        type: apiKey
                        in: header
                        name: X-API-KEY
        models:
            use_jms: false

when@test: *nelmio_api_doc_config
 