mercure:
    hubs:
        default:
            # dunglas/mercure v0.21 (Dockerfile.mercure) speaks the 0.x protocol: "mercure" JWT claim
            protocol_version: '0.x'
            url: '%env(default::MERCURE_URL)%'
            public_url: '%env(default::MERCURE_PUBLIC_URL)%'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
                claims:
                    iss: '%env(MERCURE_JWT_ISSUER)%'
                    sub: 'app'
                    client_id: 'app'
