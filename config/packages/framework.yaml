# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Comma-separated IPs/CIDRs of the reverse proxy / load balancer in front of
    # the app (see TRUSTED_PROXIES in .env). Only these sources may set the
    # X-Forwarded-* headers below. Never use 0.0.0.0/0 in production: it lets any
    # client spoof its IP (bypassing per-IP rate limits) and its scheme.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_path: /
        cookie_samesite: lax
        cookie_secure: auto

    # One sanitizer per rich-text field, matching its editor toolbar in
    # assets/admin/admin.css. ticket_type_disabled_reason = links and bold only.
    html_sanitizer:
        sanitizers:
            app.ticket_type_disabled_reason:
                allow_safe_elements: false
                allow_elements:
                    a: ['href']
                    strong: []
                    b: []
                    div: []
                allow_relative_links: false
                allow_relative_medias: false
                allowed_link_schemes: ['https', 'http', 'mailto', 'tel']
                force_attributes:
                    a:
                        target: '_blank'
                        rel: 'noopener noreferrer'
                        class: 'text-red-600 hover:text-red-700 underline'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
