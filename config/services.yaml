# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    default_from_email: 'noreply@example.com'
    default_admin_email: 'admin@example.com'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Payment\PaymentInitiatorInterface: '@App\Payment\OmnipayMolliePaymentInitiator'

    App\Payment\OmnipayMolliePaymentInitiator:
        arguments:
            $mollieApiKey: '%env(MOLLIE_API_KEY)%'
            $returnUrl: '%env(ILGRIGIO_RESERVERINGEN_BASE_URL)%/bedankt'
            $webhookUrl: '%env(ILGRIGIO_RESERVERINGEN_BASE_URL)%/webhook/mollie'

    App\Webhook\MollieWebhookConsumer:
        arguments:
            $mollieApiKey: '%env(MOLLIE_API_KEY)%'

    App\Webhook\MollieRequestParser:
        tags:
            - name: webhook.request_parser
              type: mollie

    # Email message handler configuration
    App\MessageHandler\SendOrderEmailMessageHandler:
        arguments:
            $appBaseUrl: '%env(ILGRIGIO_RESERVERINGEN_BASE_URL)%'
            $fromEmail: '%env(default:default_from_email:MAILER_FROM_EMAIL)%'
            $fromName: '%env(MAILER_FROM_NAME)%'
            $adminEmail: '%env(default:default_admin_email:ADMIN_EMAIL)%'

    # PDF Storage Service configuration
    App\Service\SecurePdfStorageService:
        arguments:
            $tokenSecret: '%env(PDF_TOKEN_SECRET)%'
            $tokenExpirationDays: '%env(int:PDF_TOKEN_EXPIRATION_DAYS)%'

    # Checkout order assembly
    App\Service\CheckoutService:
        arguments:
            $taxRatePercent: '%env(float:TAX_RATE)%'

    # Ticketing Controller configuration
    App\Controller\TicketingController:
        arguments:
            $maxTicketsPerOrder: '%env(int:MAX_TICKETS_PER_ORDER)%'
            $taxRate: '%env(float:TAX_RATE)%'

    # API Key Authenticator configuration
    App\Security\ApiKeyAuthenticator:
        arguments:
            $apiKey: '%env(API_KEY)%'

    # New Relic Monolog Handler configuration
    App\Service\NewRelicMonologHandler:
        arguments:
            $licenseKey: '%env(NEW_RELIC_LICENSE_KEY)%'
            $endpoint: '%env(NEW_RELIC_LOGS_ENDPOINT)%'
            $appName: '%env(NEW_RELIC_APP_NAME)%'
            $environment: '%kernel.environment%'

    # Dedicated CurlHttpClient for the SQS transport. Injects directly into
    # AmazonSqsTransportFactory so async-aws never wraps it in AsyncResponse.
    # Without AsyncResponse in the chain, AsyncAws\Core\Response.__destruct()
    # cannot crash during PHP shutdown when the worker restarts on --time-limit.
    sqs.http_client:
        class: Symfony\Component\HttpClient\CurlHttpClient

    Symfony\Component\Messenger\Bridge\AmazonSqs\Transport\AmazonSqsTransportFactory:
        arguments:
            $httpClient: '@sqs.http_client'
