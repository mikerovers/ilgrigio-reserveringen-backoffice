services:
    ###> doctrine/doctrine-bundle ###
    database:
        image: postgres:${POSTGRES_VERSION:-18}-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-app}
            # You should definitely change the password in production
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
            POSTGRES_USER: ${POSTGRES_USER:-app}
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-d",
                    "${POSTGRES_DB:-app}",
                    "-U",
                    "${POSTGRES_USER:-app}",
                ]
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - database_data:/var/lib/postgresql/data:rw
            # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
            # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

    # Mercure hub for the scanner app (live check-in sync). Own image, see Dockerfile.mercure.
    mercure:
        build:
            context: .
            dockerfile: Dockerfile.mercure
        restart: unless-stopped
        ports:
            - "3000:80"
        environment:
            SERVER_NAME: ':80'
            # Must equal MERCURE_JWT_SECRET in .env
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
            # Must match MERCURE_JWT_ISSUER in .env
            MERCURE_TRUSTED_ISSUERS: ${MERCURE_JWT_ISSUER:-http://scanner.localhost:8000}
            # Scanner pages subscribe from these origins (symfony server runs on https).
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins http://scanner.localhost:8000 https://scanner.localhost:8000
                publish_origins *
        volumes:
            - mercure_data:/data
            - mercure_config:/config

volumes:
    ###> doctrine/doctrine-bundle ###
    database_data:
###< doctrine/doctrine-bundle ###
    mercure_data:
    mercure_config:
