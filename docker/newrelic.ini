
; --- il-grigio overrides (appended by Dockerfile) ---
; Agent stays idle when NEW_RELIC_LICENSE_KEY is empty.
newrelic.daemon.start_timeout = "5s"
newrelic.daemon.app_connect_timeout = "15s"
newrelic.application_logging.enabled = true
newrelic.application_logging.forwarding.enabled = true
newrelic.application_logging.forwarding.context_data.enabled = true
newrelic.application_logging.metrics.enabled = true
; Minimum level forwarded to New Relic (DEBUG, INFO, NOTICE, WARNING, ERROR, CRITICAL, ALERT, EMERGENCY).
; Override at runtime with NEW_RELIC_LOG_LEVEL; defaults to WARNING.
newrelic.application_logging.forwarding.log_level = "${NEW_RELIC_LOG_LEVEL:-WARNING}"
